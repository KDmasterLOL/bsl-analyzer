name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all --no-fail-fast

  # The broker's named-pipe transport and Windows detached-spawn paths only exist
  # under cfg(windows); this job is the native compile + runtime gate for them.
  windows-broker:
    name: Windows broker (named pipe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binary (compiles the Windows broker cfg paths)
        run: cargo build -p bsl-analyzer --bin bsl-analyzer-app
      - name: Broker tests (named-pipe transport, reuse, idle, concurrency)
        run: cargo test -p mcp-server --test broker
