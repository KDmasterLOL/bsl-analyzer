# CLI
clap.workspace = true

# Async
tokio.workspace = true
crossbeam-channel.workspace = true

# Parallelism
rayon.workspace = true
indicatif.workspace = true
parking_lot.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
