[package]
name = "bsl-analyzer"
version.workspace = true
edition.workspace = true
license = "LGPL-3.0-or-later"
rust-version.workspace = true

[lib]
doctest = false

[[bin]]
name = "bsl-analyzer-app"
path = "src/bin/main.rs"

[dependencies]
ide.workspace = true
parser.workspace = true
ide-db.workspace = true
base-db.workspace = true
salsa.workspace = true
bsl-metadata.workspace = true
bsl-platform.workspace = true
project-model.workspace = true
vfs.workspace = true
vfs-notify.workspace = true
paths.workspace = true
line-index.workspace = true
stdx.workspace = true
profile.workspace = true
mcp-server.workspace = true
bsl-debug.workspace = true
onec-client.workspace = true
bsl-search.workspace = true

# LSP
lsp-types.workspace = true
lsp-server.workspace = true

# CLI
clap.workspace = true

# Async
tokio.workspace = true
crossbeam-channel.workspace = true

# Parallelism
rayon.workspace = true
indicatif.workspace = true
parking_lot.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
toml_edit = "0.25"

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true
rustc-hash.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Utilities
walkdir.workspace = true
tempfile.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }

# Allocator (Unix only — reduces memory fragmentation in multithreaded workloads)
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator.workspace = true

[build-dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
walkdir = "2.4"

[dev-dependencies]
expect-test.workspace = true
