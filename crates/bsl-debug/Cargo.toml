[package]
name = "bsl-debug"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
quick-xml = "0.39"
reqwest = { version = "0.13", features = ["rustls", "blocking"], default-features = false }
tokio = { version = "1", features = ["sync", "time"] }
