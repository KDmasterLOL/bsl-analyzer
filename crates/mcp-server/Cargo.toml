[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
bsl-debug.workspace = true
bsl-metadata.workspace = true
naparnik.workspace = true
bsl-platform.workspace = true
bsl-search.workspace = true
onec-client.workspace = true
parser.workspace = true
project-model.workspace = true
sdbl-hir.workspace = true
syntax.workspace = true
ide.workspace = true
base-db.workspace = true
vfs.workspace = true
walkdir.workspace = true
rayon.workspace = true

rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
schemars = "1.2"
tokio = { version = "1", features = [
    "net",
    "rt-multi-thread",
    "sync",
    "macros",
    "io-util",
    "io-std",
    "time",
] }
notify.workspace = true

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs = "6"
blake3 = "1.8"
rusqlite.workspace = true
rustc-hash = "2.1"
interprocess = { version = "2.4.2", features = ["tokio"] }

# Broker peer-credential / runtime-dir ownership checks (euid). Unix only;
# already in the tree via interprocess.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
expect-test.workspace = true
tempfile.workspace = true
# Client feature only for the broker integration test (drives a real MCP handshake
# through the daemon). Unified with the lib's server features at build time.
rmcp = { version = "1.7", features = ["client"] }
