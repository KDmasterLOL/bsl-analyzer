stages:
  - test
  - build
  - upload
  - publish

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUSTFLAGS: "-D warnings"
  GIT_DEPTH: 1
  CI_IMAGE: gitlab.runsystems.ru:5050/proit/ci:rust-1.95

.cargo-cache:
  cache:
    key: cargo-registry
    unprotect: true
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache


test:
  stage: test
  image: ${CI_IMAGE}
  tags:
    - autoscale
  extends: .cargo-cache
  script:
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features
    # Unit tests must run hermetically: the proit group injects EMBEDDING_*/OpenRouter
    # credentials into every job, which would make the reference backend do live embedding
    # warmup and hold the broker daemon past its idle-exit window (broker::tests fail). Tests
    # that need an embedder set the env themselves; here we drop the inherited credentials.
    - unset EMBEDDING_URL EMBEDDING_API_KEY EMBEDDING_MODEL EMBEDDING_PROVIDER OPENROUTER_API_KEY
    - cargo test --all --no-fail-fast
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG


test:powershell:
  stage: test
  image: mcr.microsoft.com/powershell:latest
  tags:
    - autoscale
  script:
    - pwsh -NoProfile -File scripts/lint-powershell.ps1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG


.build-base:
  stage: build
  image: ${CI_IMAGE}
  tags:
    - autoscale
  extends: .cargo-cache
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG

.platform-linux:
  variables:
    RUST_TARGET: x86_64-unknown-linux-gnu
    PLATFORM_SUFFIX: linux-amd64
    BINARY_EXT: ""

.platform-windows-msvc:
  variables:
    RUST_TARGET: x86_64-pc-windows-msvc
    PLATFORM_SUFFIX: windows-amd64
    BINARY_EXT: ".exe"
    CXXFLAGS: "-DMAP_FAILED=((void*)-1)"

build:linux-amd64:
  extends:
    - .build-base
    - .platform-linux
  script:
    - cargo build --release --target ${RUST_TARGET}
    - mkdir -p artifacts
    - cp target/${RUST_TARGET}/release/bsl-analyzer artifacts/bsl-analyzer-${PLATFORM_SUFFIX}
    - cp target/${RUST_TARGET}/release/bsl-analyzer-app artifacts/bsl-analyzer-app-${PLATFORM_SUFFIX}
    - ls -la artifacts/

build:windows-amd64:
  extends:
    - .build-base
    - .platform-windows-msvc
  script:
    - cargo xwin build --release --target ${RUST_TARGET}
    - mkdir -p artifacts
    - cp target/${RUST_TARGET}/release/bsl-analyzer${BINARY_EXT} artifacts/bsl-analyzer-${PLATFORM_SUFFIX}${BINARY_EXT}
    - cp target/${RUST_TARGET}/release/bsl-analyzer-app${BINARY_EXT} artifacts/bsl-analyzer-app-${PLATFORM_SUFFIX}${BINARY_EXT}
    - ls -la artifacts/



upload:
  stage: upload
  image: curlimages/curl:latest
  tags:
    - autoscale
  needs:
    - build:linux-amd64
    - build:windows-amd64
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}  # v0.1.0 -> 0.1.0
      echo "Uploading version ${VERSION}"

      for file in artifacts/*; do
        PLATFORM=$(basename "$file")
        echo "Uploading ${PLATFORM}..."

        curl -f -X POST "${RELEASE_SERVER_URL}/upload" \
          -H "Authorization: Bearer ${RELEASE_UPLOAD_TOKEN}" \
          -H "X-Product: bsl-analyzer" \
          -H "X-Version: ${VERSION}" \
          -H "X-Platform: ${PLATFORM}" \
          --data-binary "@${file}"

        echo "Uploaded ${PLATFORM}"
      done
  rules:
    - if: $CI_COMMIT_TAG && $RELEASE_SERVER_URL


publish:
  stage: publish
  image: curlimages/curl:latest
  tags:
    - autoscale
  needs:
    - upload
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      echo "Publishing version ${VERSION}"

      curl -f -X POST "${RELEASE_SERVER_URL}/publish/bsl-analyzer/${VERSION}" \
        -H "Authorization: Bearer ${RELEASE_UPLOAD_TOKEN}"

      echo "Version ${VERSION} published successfully"

      echo "Uploading install.sh..."
      curl -f -X POST "${RELEASE_SERVER_URL}/upload-static" \
        -H "Authorization: Bearer ${RELEASE_UPLOAD_TOKEN}" \
        -H "X-Filename: install.sh" \
        --data-binary "@scripts/install.sh"

      echo "install.sh uploaded"

      echo "Uploading install.ps1..."
      curl -f -X POST "${RELEASE_SERVER_URL}/upload-static" \
        -H "Authorization: Bearer ${RELEASE_UPLOAD_TOKEN}" \
        -H "X-Filename: install.ps1" \
        --data-binary "@scripts/install.ps1"

      echo "install.ps1 uploaded"
  rules:
    - if: $CI_COMMIT_TAG && $RELEASE_SERVER_URL

release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:v1.60.0
  tags:
    - autoscale
  needs:
    - job: build:linux-amd64
      artifacts: true
    - job: build:windows-amd64
      artifacts: true
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
  rules:
    - if: $CI_COMMIT_TAG


github-sync:
  stage: publish
  image: ${CI_IMAGE}
  tags:
    - autoscale
  needs:
    - job: build:linux-amd64
      artifacts: false
  before_script:
    - mkdir -p ~/.ssh
    - echo "$GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
    - apt-get update -qq && apt-get install -y -qq rsync > /dev/null 2>&1 || true
    - git config --global user.name "BSL Analyzer CI"
    - git config --global user.email "itrous@gmail.com"
  script:
    - ./scripts/github-sync.sh "${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG && $GITHUB_SSH_KEY
      when: manual
      allow_failure: true


doc:
  stage: test
  image: ${CI_IMAGE}
  tags:
    - autoscale
  extends: .cargo-cache
  script:
    - cargo doc --all --no-deps
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
