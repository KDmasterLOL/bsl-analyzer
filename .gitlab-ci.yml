stages:
  - test
  - build
  - upload
  - publish

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUSTFLAGS: "-D warnings"
  GIT_DEPTH: 1
  CI_IMAGE: gitlab.runsystems.ru:5050/proit/ci:rust-1.93

.cargo-cache:
  cache:
    key: cargo-registry
    unprotect: true
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache

# ============================================
# Stage: test
# ============================================

test:
  stage: test
  image: ${CI_IMAGE}
  tags:
    - autoscale
  extends: .cargo-cache
  script:
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features
    - cargo test --all --no-fail-fast
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================
# Stage: build
# ============================================

.build-base:
  stage: build
  image: ${CI_IMAGE}
  tags:
    - autoscale
  extends: .cargo-cache
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG

.platform-linux:
  variables:
    RUST_TARGET: x86_64-unknown-linux-gnu
    PLATFORM_SUFFIX: linux-amd64
    BINARY_EXT: ""

.platform-windows-gnu:
  variables:
    RUST_TARGET: x86_64-pc-windows-gnu
    PLATFORM_SUFFIX: windows-amd64
    BINARY_EXT: ".exe"

# Linux AMD64 (glibc 2.35, compatible with Ubuntu 22.04+)
build:linux-amd64:
  extends:
    - .build-base
    - .platform-linux
  script:
    - cargo build --release --target ${RUST_TARGET}
    - mkdir -p artifacts
    - cp target/${RUST_TARGET}/release/bsl-analyzer artifacts/bsl-launcher-${PLATFORM_SUFFIX}
    - cp target/${RUST_TARGET}/release/bsl-analyzer-app artifacts/bsl-analyzer-app-${PLATFORM_SUFFIX}
    - ls -la artifacts/

# Windows AMD64 (cross-compilation via mingw)
build:windows-amd64:
  extends:
    - .build-base
    - .platform-windows-gnu
  script:
    - cargo build --release --target ${RUST_TARGET}
    - mkdir -p artifacts
    - cp target/${RUST_TARGET}/release/bsl-analyzer${BINARY_EXT} artifacts/bsl-launcher-${PLATFORM_SUFFIX}${BINARY_EXT}
    - cp target/${RUST_TARGET}/release/bsl-analyzer-app${BINARY_EXT} artifacts/bsl-analyzer-app-${PLATFORM_SUFFIX}${BINARY_EXT}
    - ls -la artifacts/

# macOS builds require local MacBook - see scripts/build-macos.sh

# ============================================
# Stage: upload
# ============================================

upload:
  stage: upload
  image: curlimages/curl:latest
  tags:
    - autoscale
  needs:
    - build:linux-amd64
    - build:windows-amd64
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}  # v0.1.0 -> 0.1.0
      echo "Uploading version ${VERSION}"

      for file in artifacts/*; do
        PLATFORM=$(basename "$file")
        echo "Uploading ${PLATFORM}..."

        curl -f -X POST "${RELEASE_SERVER_URL}/upload" \
          -H "Authorization: Bearer ${RELEASE_UPLOAD_TOKEN}" \
          -H "X-Product: bsl-analyzer" \
          -H "X-Version: ${VERSION}" \
          -H "X-Platform: ${PLATFORM}" \
          --data-binary "@${file}"

        echo "Uploaded ${PLATFORM}"
      done
  rules:
    - if: $CI_COMMIT_TAG && $RELEASE_SERVER_URL

# ============================================
# Stage: publish
# ============================================

publish:
  stage: publish
  image: curlimages/curl:latest
  tags:
    - autoscale
  needs:
    - upload
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      echo "Publishing version ${VERSION}"

      curl -f -X POST "${RELEASE_SERVER_URL}/publish/bsl-analyzer/${VERSION}" \
        -H "Authorization: Bearer ${RELEASE_UPLOAD_TOKEN}"

      echo "Version ${VERSION} published successfully"

      echo "Uploading install.sh..."
      curl -f -X POST "${RELEASE_SERVER_URL}/upload-static" \
        -H "Authorization: Bearer ${RELEASE_UPLOAD_TOKEN}" \
        -H "X-Filename: install.sh" \
        --data-binary "@scripts/install.sh"

      echo "install.sh uploaded"
  rules:
    - if: $CI_COMMIT_TAG && $RELEASE_SERVER_URL

# GitLab Release
release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:v1.60.0
  tags:
    - autoscale
  needs:
    - job: build:linux-amd64
      artifacts: true
    - job: build:windows-amd64
      artifacts: true
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
  rules:
    - if: $CI_COMMIT_TAG

# ============================================
# Stage: GitHub mirror
# ============================================

github-sync:
  stage: publish
  image: ${CI_IMAGE}
  tags:
    - autoscale
  needs:
    - job: build:linux-amd64
      artifacts: false
  before_script:
    - mkdir -p ~/.ssh
    - echo "$GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
    - apt-get update -qq && apt-get install -y -qq rsync > /dev/null 2>&1 || true
    - git config --global user.name "BSL Analyzer CI"
    - git config --global user.email "bsl-analyzer@users.noreply.github.com"
  script:
    - ./scripts/github-sync.sh "${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG && $GITHUB_SSH_KEY
      when: manual
      allow_failure: true

# ============================================
# Optional: documentation
# ============================================

doc:
  stage: test
  image: ${CI_IMAGE}
  tags:
    - autoscale
  extends: .cargo-cache
  script:
    - cargo doc --all --no-deps
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
