[workspace]
resolver = "2"
members = [
    "crates/*",
    "xtask",
]

[workspace.package]
version = "0.1.96"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["BSL Analyzer Contributors"]
repository = "https://github.com/itrous/bsl-analyzer"
rust-version = "1.91"

[workspace.dependencies]
# Internal crates
bsl-analyzer = { path = "crates/bsl-analyzer" }
syntax = { path = "crates/syntax" }
parser = { path = "crates/parser" }
lexer = { path = "crates/lexer" }
base-db = { path = "crates/base-db" }
bsl-metadata = { path = "crates/bsl-metadata" }
bsl-platform = { path = "crates/bsl-platform" }
cfg = { path = "crates/cfg" }
cfg-types = { path = "crates/cfg-types" }
dataflow = { path = "crates/dataflow" }
ide = { path = "crates/ide" }
ide-db = { path = "crates/ide-db" }
ide-diagnostics = { path = "crates/ide-diagnostics" }
ide-assists = { path = "crates/ide-assists" }
hir = { path = "crates/hir" }
hir-def = { path = "crates/hir-def" }
hir-ty = { path = "crates/hir-ty" }
sdbl-hir = { path = "crates/sdbl-hir" }
vfs = { path = "crates/vfs" }
project-model = { path = "crates/project-model" }
intern = { path = "crates/intern" }
stdx = { path = "crates/stdx" }
profile = { path = "crates/profile" }
test-fixture = { path = "crates/test-fixture" }
test-utils = { path = "crates/test-utils" }
line-index = { path = "crates/line-index" }
paths = { path = "crates/paths" }
vfs-notify = { path = "crates/vfs-notify" }
bsl-launcher = { path = "crates/bsl-launcher" }
bsl-debug = { path = "crates/bsl-debug" }
mcp-server = { path = "crates/mcp-server" }
onec-client = { path = "crates/onec-client" }
bsl-search = { path = "crates/bsl-search" }
naparnik = { path = "crates/naparnik" }

# Salsa for incremental computation
salsa = { version = "0.25.2", features = ["rayon", "macros"] }
salsa-macros = "0.25.2"

# LSP protocol
lsp-types = "0.95"
lsp-server = "0.7"

# Parsing infrastructure (rowan for syntax trees)
rowan = "0.16.1"
logos = "0.14"
text-size = "1.1.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = { version = "0.1.42", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "registry",
    "fmt",
    "std",
    "tracing-log",
    "chrono",
] }
tracing-tree = "0.4.0"

# Parallelism
rayon = "1.8"

# Allocator
tikv-jemallocator = "0.6"

# Progress indicators
indicatif = "0.17"

# Utilities
once_cell = "1.19"
dashmap = "5.5"
parking_lot = "0.12"
indexmap = "2.1"
itertools = "0.12"
smol_str = "0.3.2"
la-arena = "0.3"
smallvec = "1.13"
triomphe = { version = "0.1.14", default-features = false, features = ["std"] }
rustc-hash = "2.0"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
jod-thread = "0.1"
libc = "0.2"
regex = "1.10"
unicase = "2.7"
fixedbitset = "0.5"
ordered-float = "5.1"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
walkdir = "2.4"
ignore = "0.4"
spellbook = "0.4"
notify = "6.1"
camino = "1.1"
rust-stemmers = "1.2"

# Testing
expect-test = "1.4"
tempfile = "3.8"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# Profile for development with debug info
[profile.release-with-debug]
inherits = "release"
strip = false
debug = 1

[profile.dev]
# Faster compile times
debug = 0

[profile.dev.package."*"]
opt-level = 3
